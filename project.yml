name: CommandCenter
options:
  bundleIdPrefix: com.tarzanillges
  deploymentTarget:
    iOS: "16.0"
targets:
  CommandCenter:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Command Center
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Lets you show Ellie a photo or scan from the Command Center.
        NSMicrophoneUsageDescription: Lets you talk to Ellie by voice.
        NSPhotoLibraryUsageDescription: Lets you attach pictures in the Command Center.
        CFBundleURLTypes:
          - CFBundleURLName: com.tarzanillges.commandcenter
            CFBundleURLSchemes: [commandcenter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarzanillges.commandcenter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
